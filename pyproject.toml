[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexppi"
version = "0.1.0"
description = "Residue backbone fluctuations and side-chain joint-state entropy from static protein geometry"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
md = [
  "numpy>=1.24,<2.0",
  "MDAnalysis>=2.7",
  "scipy>=1.9",
]
esm = [
    "transformers>=4.41",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
[project.scripts]
flexppi = "flexppi.cli:main"

[tool.setuptools]
packages = ["flexppi", "flexppi.data", "flexppi.model", "flexppi_weights"]
package-dir = {"" = "src", flexppi_weights = "models"}

[tool.setuptools.package-data]
flexppi_weights = ["full/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
