[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexppi"
version = "0.1.0"
description = "Partner-conditioned prediction of absolute protein flexibility and binding-induced residue responses"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
md = [
  "numpy>=1.24,<2.0",
  "MDAnalysis>=2.7",
  "scipy>=1.9",
]
esm = [
    "transformers>=4.41",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
benchmark = [
    "orca-graphlets>=0.1.4",
    "scipy>=1.9",
]

[project.scripts]
flexppi = "flexppi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
