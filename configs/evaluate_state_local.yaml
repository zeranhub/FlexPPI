stage: pretrain
seed: 7
device: auto
output_dir: artifacts/evaluation/state

data:
  state_manifest:
    - artifacts/data/atlas_states.jsonl
    - artifacts/data/dynarepo_states.jsonl
  pair_manifest: null
  max_residues: 768
  batch_size: 1
  num_workers: 0
  path_mappings:
    /ranze/repos/FlexPPI/artifacts/data: 'E:\Project\FlexPPI\artifacts\data'
    /ranze/data/ATLAS_extracted: 'E:\data\protein_md_datasets\ATLAS_extracted'
    /ranze/data/dynarepo/dynarepo_non_nucleic_full: 'D:\data\dynarepo_non_nucleic_full'

train:
  val_fraction: 0.1

