stage: pretrain
seed: 7
device: auto
output_dir: artifacts/information_ablation/sequence/fold_1
data:
  state_manifest: data/splits/state_rmsf_hchi_v2_atlas_hchi_v1/fold_1_train.jsonl
  validation_state_manifest: null
  test_state_manifest: data/splits/state_rmsf_hchi_v2_atlas_hchi_v1/fold_1_test.jsonl
  pair_manifest: null
  max_residues: 1024
  batch_size: 1
  num_workers: 0
  path_mappings: {}
model:
  information_ablation: sequence
  sequence_backend: learned
  esm_model_name: facebook/esm2_t6_8M_UR50D
  freeze_esm: true
  single_dim: 128
  pair_dim: 48
  sequence_dim: 128
  ipa_blocks: 4
  ipa_heads: 8
  ipa_scalar_dim: 16
  ipa_qk_points: 4
  ipa_v_points: 8
  rbf_bins: 24
  dropout: 0.1
  use_condition_features: false
  enable_response_head: false
  metrics:
  - rmsf
  - chi_entropy
train:
  epochs: 40
  val_fraction: 0.0
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 25
  checkpoint_every: 1
  sampling_strategy: source_system_balanced
  samples_per_epoch: null
  metric_weights:
    rmsf: 1.0
    chi_entropy: 1.0
init_checkpoint: null
